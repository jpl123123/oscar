[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscar-ascend"
version = "0.2.0"
description = "OSCAR INT2 KV-cache quantization for vllm-ascend 0.23.1.dev0+g5cb98caaa.d20260822"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "vllm==0.23.0", "vllm-ascend==0.23.1.dev0+g5cb98caaa.d20260822"]

[project.entry-points."vllm.general_plugins"]
oscar_ascend = "oscar_ascend.plugin:load_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["oscar_ascend*"]
